<section class="band-navy on-navy cta-band" aria-labelledby="cta-title">
  <div class="wrap">
    <h2 id="cta-title">{{ctaTitle}}</h2>
    <p class="lead">{{ctaText}}</p>
    <div class="contact-block">
      <div class="contact-item">
        <span class="label">Email</span>
        <span class="value"><!--email_off--><a href="mailto:contact@anidha.com">contact@anidha.com</a><!--/email_off--><button class="copy-btn" type="button" data-copy="contact@anidha.com" aria-label="Copy email address">Copy</button></span>
      </div>
      <div class="contact-item">
        <span class="label">Phone, Monday to Friday, 9:00 to 18:00 IST</span>
        <span class="value"><a href="tel:+917799832255">+91 77998 32255</a><button class="copy-btn" type="button" data-copy="+91 77998 32255" aria-label="Copy phone number">Copy</button></span>
      </div>
    </div>
  </div>
</section>
